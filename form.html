<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Creating form -->
    <form action="">
        <Fieldset style="border-color: blue; border-width: 3px;font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;font-style:italic; ">
                <legend align="center">LOGIN PAGE</legend>
                <label for="username">Enter the Name :</label>
                <input type="text" placeholder="Username" id="user"><br><br>
                <label for="password">Enter the password :</label>
                <input type="password" placeholder="password" id="pass"><br><br>
                <label for="email">Enter the Email Address :</label>
                <input type="email" placeholder="Email Address" id="email"><br><br>
                <label for="number">Enter the Ph Number :</label>
                <input type="number" id="phno" placeholder="Number"><br><br>
                <label for="telno">Telephone Number</label>
                <input type="tel" placeholder="Tel.no" id="telno"><br><br>
                <label for="date">Date :</label>
                <input type="date" id="datesel"><br><br>
                <label for="color">color</label>
                <input type="color" id="color"><br><br>
                <label for="fi">File</label>
                <input type="file" id="file"><br><br>
                <label for="range">Range</label>
                <input type="range" id="range"><br><br>
                <label for="search">Search</label>
                <input type="search" placeholder="Search" id="search"><br><br>
                <label for="url">URL</label>
                <input type="url" placeholder="paste or enter the URL">
        </fieldset>
    </form>
</body>
</html>
