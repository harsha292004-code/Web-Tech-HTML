<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Creating form -->
    <form action="">
        <Fieldset style="border-color: blue; border-width: 3px;font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        font-style:italic; "><!--this helps to get the border or box for
         the form label are the text inside the form and input tag is used to set input and its type-->
                <legend align="center">LOGIN PAGE</legend>
                <label for="username">Enter the Name :</label>
                <input type="text" placeholder="Username" id="username"><br><br>
                <label for="password">Enter the password :</label>
                <input type="password" placeholder="password" id="password"><br><br>
                <label for="email">Enter the Email Address :</label>
                <input type="email" placeholder="Email Address" id="email"><br><br>
                <label for="number">Enter the Ph Number :</label>
                <input type="number" id="number" placeholder="Number"><br><br>
                <label for="telno">Telephone Number</label>
                <input type="tel" placeholder="Tel.no" id="telno"><br><br>
                <label for="date">Date :</label>
                <input type="date" id="date"><br><br>
                <label for="color">color</label>
                <input type="color" id="color"><br><br>
                <label for="fi">File</label>
                <input type="file" id="fi"><br><br>
                <label for="range">Range</label>
                <input type="range" id="range"><br><br>
                <label for="search">Search</label>
                <input type="search" placeholder="Search" id="search"><br><br>
                <label for="url">URL</label>
                <input type="url" placeholder="paste or enter the URL" id="url">
        </fieldset>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset style="border-width: 5px; border-color: green;border-style: dashed;">
            <!-- This is the sample of radio button-->
            <strong>Select your Emotional state :</strong><br><br>
            <input type="radio" id="happy">
            <label for="happy">HAPPY</label><br><br>
            <input type="radio" id="love">
            <label for="love">LOVE</label><br><br>
            <input type="radio" id="moti">
            <label for="moti">MOTIVATED</label><br><br>
            <input type="radio" id="disciplined">
            <label for="disciplined">DISCIPLINED</label><br><br>
            <!-- Example of the checkbox button -->
             <strong>Select what you want :</strong><br><br>
             <input type="checkbox" id="Money">
             <label for="Money">MONEY</label><br><br>
             <input type="checkbox" id="health">
             <label for="health">HEALTH</label><br><br>
             <input type="checkbox" id="happiness">
             <label for="happiness">HAPPINESS</label><br><br>
             <input type="checkbox" id="Fam and friends">
             <label for="Fam and friends">FAM AND FRIENDS</label><br><br>
             <hr color="skyblue">
             <!-- Dropdown menu -->
            <!-- we use the select tag and iside that we use the option tag -->
             <select name="" id="Dropdown">
                <option value="" hidden>----Choose Here----</option><!--Can use the hidden attribute to hide the option-->
                <option value="">Belief</option>
                <option value="">Trust</option>
                <option value="">Faith</option>
             </select>
             <hr>
             <!-- DataList -->
            <!-- uses the input type and list attributes for connecting the datalists id-->
            <input type="text" name="" id="" list="exercise">
            <datalist id="exercise">
                <option value="Yoga"></option>
                <option value="Calisthenics"></option>
                <option value="Hybrid"></option>
                <option value="Bodybuilding"></option>
                <option value="ultraRunner"></option>
            </datalist>
        </fieldset>
    </form>
</body>
</html>
